aid: bespoke-labs
name: Bespoke Labs
description: >-
  Bespoke Labs is an applied AI research lab building environment infrastructure, data
  curation, and evaluation tooling for AI agents and post-training. Its open-source Bespoke
  Curator library generates high-quality synthetic data at scale for model finetuning and
  structured extraction, and its Bespoke MiniCheck ("Argus") API offers a lightweight
  grounded-factuality / hallucination-detection service that scores whether a claim is
  supported by a given context. The lab is also known for OpenThoughts reasoning datasets,
  Terminal-Bench, the GEPA prompt optimizer, MiniChart, and OpenThinker. Backed by 8VC,
  Mayfield, and Wing Venture Capital.
